[project]
name = "arpeggio"
version = "0.1.0"
description = "Composable music perception, analysis, fingerstyle arrangement and tablature export toolkit (CLI + Claude Skill)"
authors = [
    { name = "Severyn", email = "severynson.kurach@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "librosa>=1.0.1",
    "music21>=10.5.2",
    "numpy>=2.5.5",
    "pretty-midi>=0.2.11.post0",
    "pydantic>=2.14.4",
    "pyguitarpro>=0.11",
    "python-dotenv>=1.2.4",
    "soundfile>=0.14.0",
    "typer>=0.29.3",
]

[project.scripts]
arpeggio = "arpeggio.cli:main"

[project.optional-dependencies]
ml = [
    "beat-this>=1.1.0",
    "lv-chordia>=1.1.0",
    "muscriptor>=0.2.1",
]
separation = [
    "demucs>=4.0.1",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
